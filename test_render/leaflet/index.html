<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Leaflet Render Test</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; }
        #map { width: 100vw; height: 100vh; }
        #status { position: fixed; top: 10px; left: 50px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 8px; font: 13px sans-serif; z-index: 1000; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="status">Loading NBS Source...</div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script>
        var map = L.map("map", { preferCanvas: true }).setView([30, -80], 5);
        L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
            subdomains: "abcd", maxZoom: 20
        }).addTo(map);

        var layer = L.geoJSON(null, {
            style: { color: "rgba(100,140,255,0.7)", weight: 1, fillColor: "rgba(100,140,255,0.5)", fillOpacity: 0.5 }
        }).addTo(map);

        new QWebChannel(qt.webChannelTransport, function (channel) {
            var bridge = channel.objects.bridge;
            bridge.load_remote_layer("bluetopo");
        });

        function onLayersReady(data) {
            if (data.error) {
                document.getElementById("status").textContent = "Error: " + data.error;
                return;
            }
            layer.addData(data.data);
            var count = layer.getLayers().length;
            document.getElementById("status").textContent = "Leaflet Canvas: " + count + " polygons. Zoom in/out to test.";
            if (count > 0) map.fitBounds(layer.getBounds(), { padding: [20, 20] });
        }
    </script>
</body>
</html>
