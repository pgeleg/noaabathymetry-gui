<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MapLibre Render Test</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <style>
        body { margin: 0; }
        #map { width: 100vw; height: 100vh; }
        #status { position: fixed; top: 10px; left: 50px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 8px; font: 13px sans-serif; z-index: 1000; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="status">Loading NBS Source...</div>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script>
        var map = new maplibregl.Map({
            container: "map",
            style: {
                version: 8,
                sources: {
                    "carto": {
                        type: "raster",
                        tiles: ["https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png"],
                        tileSize: 256
                    }
                },
                layers: [{ id: "carto", type: "raster", source: "carto" }]
            },
            center: [-80, 30],
            zoom: 4
        });

        new QWebChannel(qt.webChannelTransport, function (channel) {
            var bridge = channel.objects.bridge;
            bridge.load_remote_layer("bluetopo");
        });

        function onLayersReady(data) {
            if (data.error) {
                document.getElementById("status").textContent = "Error: " + data.error;
                return;
            }
            var geojson = data.data;
            var count = geojson.features ? geojson.features.length : 0;

            map.addSource("tiles", { type: "geojson", data: geojson });
            map.addLayer({
                id: "tiles-fill",
                type: "fill",
                source: "tiles",
                paint: { "fill-color": "rgba(100,140,255,0.5)", "fill-opacity": 0.5 }
            });
            map.addLayer({
                id: "tiles-outline",
                type: "line",
                source: "tiles",
                paint: { "line-color": "rgba(100,140,255,0.7)", "line-width": 1 }
            });

            document.getElementById("status").textContent = "MapLibre WebGL: " + count + " polygons. Zoom in/out to test.";

            // Fit bounds
            if (count > 0) {
                var bounds = new maplibregl.LngLatBounds();
                geojson.features.forEach(function (f) {
                    if (f.geometry && f.geometry.coordinates) {
                        var coords = f.geometry.type === "Polygon" ? f.geometry.coordinates[0] :
                                     f.geometry.type === "MultiPolygon" ? f.geometry.coordinates[0][0] : [];
                        coords.forEach(function (c) { bounds.extend(c); });
                    }
                });
                map.fitBounds(bounds, { padding: 20 });
            }
        }
    </script>
</body>
</html>
